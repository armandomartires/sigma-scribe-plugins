[package]
name = "graph-map"
description = "Sigma Scribe Graph screen: link map and list, as a WASM screen plugin."
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sigma-plugin-api = { git = "https://github.com/armandomartires/sigma-scribe", rev = "a269e0911e49bba523b5cde72906d8edccc1bbd9" }

[dev-dependencies]
# Tests assert the layout matches the app's built-in one, bit for bit.
sigma-core = { git = "https://github.com/armandomartires/sigma-scribe", rev = "a269e0911e49bba523b5cde72906d8edccc1bbd9" }
