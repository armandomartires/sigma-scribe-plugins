[package]
name = "graph-map"
description = "Sigma Scribe Graph screen: link map and list, as a WASM screen plugin."
version = "1.3.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sigma-plugin-api = { path = "../../../sigma-scribe/crates/plugin-api" }

[dev-dependencies]
# Tests assert the layout matches the app's built-in one, bit for bit.
sigma-core = { path = "../../../sigma-scribe/crates/core" }
