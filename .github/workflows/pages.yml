# Builds the screen and pane plugins, packages every plugin and publishes the
# repository index and packages on GitHub Pages, the URL the app reads
# (sigma-core's INDEX_URL).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the wasm plugins
        run: |
          for conf in plugins/*/plugin.conf; do
            id="$(basename "$(dirname "$conf")")"
            if grep -q '^entry=' "$conf"; then scripts/build-plugin.sh "$id"; fi
          done
      - name: Package and index
        run: scripts/make-index.sh site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
